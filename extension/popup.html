<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>金融雷達 NLM 助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<!-- SVG 圖示定義（黑白 stroke 風格，currentColor 自動繼承文字色）-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>
  <symbol id="ic-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    <polyline points="15 3 21 3 21 9"/>
    <line x1="10" y1="14" x2="21" y2="3"/>
  </symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </symbol>
  <symbol id="ic-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
  </symbol>
  <symbol id="ic-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
  </symbol>
  <symbol id="ic-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="10 8 16 12 10 16 10 8"/>
  </symbol>
  <symbol id="ic-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
  </symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    <line x1="12" y1="9" x2="12" y2="15"/>
    <line x1="9" y1="12" x2="15" y2="12"/>
  </symbol>
  <symbol id="ic-file-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/>
    <line x1="9" y1="15" x2="15" y2="15"/>
  </symbol>
  <symbol id="ic-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    <line x1="10" y1="11" x2="10" y2="17"/>
    <line x1="14" y1="11" x2="14" y2="17"/>
  </symbol>
  <symbol id="ic-analyze" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="20" x2="18" y2="10"/>
    <line x1="12" y1="20" x2="12" y2="4"/>
    <line x1="6" y1="20" x2="6" y2="14"/>
  </symbol>
  <symbol id="ic-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </symbol>
</svg>

  <header>
    <h1>匯入至 NotebookLM</h1>
    <a href="#" id="open-options" class="link" title="設定">
      <svg class="icon" aria-hidden="true"><use href="#ic-settings"/></svg>
    </a>
  </header>

  <section class="notebook-row">
    <select id="notebook-select" class="select">
      <option value="">載入筆記本中…</option>
    </select>
    <button id="btn-open-notebook" class="btn-icon" title="在新分頁開啟此筆記本">
      <svg class="icon" aria-hidden="true"><use href="#ic-external-link"/></svg>
    </button>
    <button id="btn-refresh-notebooks" class="btn-icon" title="重新載入筆記本清單">
      <svg class="icon" aria-hidden="true"><use href="#ic-refresh"/></svg>
    </button>
  </section>

  <section class="report-kind">
    <span class="kind-label">分析時推送為：</span>
    <label class="kind-chip">
      <input type="radio" name="kind" value="none" checked />
      <span><svg class="icon icon-chip" aria-hidden="true"><use href="#ic-ban"/></svg> 不推送</span>
    </label>
    <label class="kind-chip">
      <input type="radio" name="kind" value="news" />
      <span><svg class="icon icon-chip" aria-hidden="true"><use href="#ic-news"/></svg> 新聞</span>
    </label>
    <label class="kind-chip">
      <input type="radio" name="kind" value="yt" />
      <span><svg class="icon icon-chip" aria-hidden="true"><use href="#ic-play"/></svg> YT</span>
    </label>
    <button id="btn-prompt-settings" class="btn-prompt-icon" title="提示詞收藏">
      <svg class="icon" aria-hidden="true"><use href="#ic-edit"/></svg>
    </button>
  </section>

  <section class="actions-row3" style="margin-bottom:10px">
    <button id="btn-import-current" class="btn btn-outline btn-action3" title="新增目前頁面至筆記本">
      <svg class="icon icon-lg" aria-hidden="true"><use href="#ic-pin"/></svg>
      <span class="a3-label">新增此頁</span>
    </button>
    <button id="btn-create-notebook" class="btn btn-outline btn-action3" title="建立新筆記本">
      <svg class="icon icon-lg" aria-hidden="true"><use href="#ic-file-plus"/></svg>
      <span class="a3-label">建立筆記本</span>
    </button>
  </section>

  <section class="divider"><span>批次操作</span></section>

  <section class="actions actions-secondary">
    <div class="actions-row3">
      <button id="btn-import" class="btn btn-outline btn-action3" title="從剪貼簿讀取 URL，批次匯入筆記本">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#ic-download"/></svg>
        <span class="a3-label">匯入</span>
      </button>
      <button id="btn-clear" class="btn btn-outline btn-action3" title="清空所有非 [SKILL] sources">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#ic-trash"/></svg>
        <span class="a3-label">清空</span>
      </button>
      <button id="btn-generate" class="btn btn-outline btn-action3" title="產生分析報告並推送 VM">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#ic-analyze"/></svg>
        <span class="a3-label">分析</span>
      </button>
    </div>
    <button id="btn-combined" class="btn btn-outline">
      <svg class="icon" aria-hidden="true"><use href="#ic-zap"/></svg>
      一鍵：清空 → 匯入 → 分析
    </button>
  </section>

  <section class="task-section">
    <div class="task-section-head">
      <span class="task-section-title">任務</span>
      <button id="btn-cancel-all" class="btn-cancel-all" hidden>✋ 全部取消</button>
    </div>
    <div id="task-list" class="task-list">
      <div id="empty-state" class="empty-state">👋 選擇筆記本後點按鈕，可同時開多個任務</div>
    </div>
  </section>

  <template id="task-row-template">
    <div class="task-row">
      <div class="task-head">
        <span class="task-icon">⏳</span>
        <span class="task-label">標籤</span>
        <span class="task-elapsed">0s</span>
        <button class="task-cancel" title="取消此任務">✋</button>
        <button class="task-dismiss" title="從清單移除" hidden>✕</button>
      </div>
      <div class="task-meta">📒 notebook · kind</div>
      <div class="task-progress">準備中…</div>
    </div>
  </template>

  <footer>
    <span id="config-hint" class="hint"></span>
  </footer>

  <!-- 提示詞收藏側邊面板 -->
  <div id="pp-backdrop" class="pp-backdrop" hidden></div>
  <div id="pp-panel" class="pp-panel" hidden>
    <div class="pp-header">
      <span class="pp-title">提示詞收藏</span>
      <button id="pp-close" class="pp-close-btn" title="關閉">✕</button>
    </div>
    <div id="pp-list" class="pp-list"></div>
    <div class="pp-sep"></div>
    <div class="pp-add-section">
      <div class="pp-add-label">新增收藏</div>
      <input id="pp-name" class="pp-name-input" type="text" placeholder="名稱（如：詳細分析）" maxlength="30" />
      <textarea id="pp-content" class="pp-content-area" rows="4" placeholder="提示詞內容…"></textarea>
      <button id="pp-add-btn" class="pp-add-btn">+ 新增</button>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
